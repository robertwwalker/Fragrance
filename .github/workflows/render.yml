name: Render site

on:
  push:
    branches: [main]
    paths:
      - '*.qmd'
      - '*.csv'
      - '.github/workflows/render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Jupyter kernel
        run: pip install jupyter

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render index
        run: quarto render index.qmd

      - name: Render journal
        run: quarto render journal.qmd

      - name: Verify outputs
        run: |
          for f in index.html journal.html; do
            if [ -f "$f" ]; then
              echo "✅ $f ($(wc -c < "$f") bytes)"
            else
              echo "❌ $f MISSING"
              exit 1
            fi
          done
          grep -q "wj-sum\|wj-none" journal.html \
            || { echo "❌ journal chunk did not run — check the fence"; exit 1; }

      - name: Commit rendered HTML
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Auto-render site [skip ci]'
          file_pattern: '*.html'